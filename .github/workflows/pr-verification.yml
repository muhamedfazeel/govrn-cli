name: PR Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: pr-verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Review PR Quality Gates
    uses: groot-arena/review-pr/.github/workflows/pr-verification.yml@2a5f773e666b4b2b274e566f9e434ce57da31648
    with:
      language: 'node'
      runtime-version: '24'
      install-command: 'npm ci'
      typecheck-command: 'npm run typecheck'
      lint-command: 'npm run lint:sarif'
      test-command: 'npm run test:ci'
      build-command: 'npm run build'
      junit-path: 'junit.xml'
      coverage-path: 'coverage/lcov.info'
      sarif-path: 'lint.sarif'
      coverage-threshold: 80
      diff-coverage-threshold: 80
